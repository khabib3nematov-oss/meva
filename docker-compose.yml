services:
  db:
    image: postgres:16-alpine
    container_name: mevachi-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mevachi}
      POSTGRES_USER: ${POSTGRES_USER:-mevachi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  bot:
    build: .
    container_name: mevachi-bot
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "app.main"]
    restart: unless-stopped

volumes:
  postgres_data:
